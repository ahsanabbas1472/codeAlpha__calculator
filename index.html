
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator">
    <header class="header">
      <div>
        <h1>Calculator</h1>
        <p>Simple. Smart. Accurate.</p>
      </div>
      <div class="calculator-icon">±</div>
    </header>

    <section class="display">
      <div id="expression" class="expression" aria-live="polite">
        0
      </div>
      <div id="preview" class="preview">Ready</div>
    </section>

    <section class="buttons" aria-label="Calculator buttons">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="backspace">⌫</button>
      <button class="operator" data-value="%">%</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="utility" data-action="sign">+/−</button>
      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="calculate">=</button>
    </section>

    <footer>
      Keyboard supported · AC to clear
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
